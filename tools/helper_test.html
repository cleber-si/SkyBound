<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s4field helper test</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e2de;
          --ok:#1f7a3a; --okbg:#e6f4ea; --bad:#a32020; --badbg:#fbe9e9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --panel:#1f1f22; --ink:#ececee; --muted:#9a9aa2; --line:#333338;
            --ok:#7fd49a; --okbg:#1d3325; --bad:#f19a9a; --badbg:#3a1f1f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  form { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:16px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:3px; }
  input, select, button { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--line);
                          background:var(--panel); color:var(--ink); }
  button { cursor:pointer; background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin:0 0 14px; }
  .tag { display:inline-block; font:600 12px ui-monospace, Menlo, monospace; padding:3px 8px; border-radius:6px; }
  .ok { background:var(--okbg); color:var(--ok); } .bad { background:var(--badbg); color:var(--bad); }
  pre { margin:0; white-space:pre-wrap; font:12.5px/1.4 ui-monospace, Menlo, monospace; overflow-x:auto; }
  .big { font-size: 18px; font-weight: 600; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>s4field helper test</h1>
  <p class="sub">Checks that this page can talk to <code>python3 s4field.py --serve</code> on your computer,
     and shows the field it recommends.</p>

  <form id="f">
    <label>Helper address <input id="base" value="http://127.0.0.1:8417" size="24"></label>
    <label>Target <input id="target" value="AU Mic" size="14"></label>
    <label>t_exp g,r,i,z [s] (empty: estimated) <input id="texp" placeholder="2,0.2,0.3,0.23" size="16"></label>
    <label>Mode <select id="mode"><option>phot</option><option>polar</option></select></label>
    <label>Airmass <input id="airmass" value="1.2" size="5"></label>
    <button>Find field</button>
  </form>

  <div class="card" id="status"><span class="tag">…</span> checking the helper</div>
  <div class="card" id="result" hidden></div>
  <div class="card" id="report" hidden><pre></pre></div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const origin = location.origin === "null" ? "file:// (opened from disk)" : location.origin;

async function api(path) {
  let r;
  try { r = await fetch($("base").value.replace(/\/$/, "") + path); }
  catch (e) { throw new Error("no answer: is `python3 s4field.py --serve` running? (or the browser blocked it)"); }
  const js = await r.json();
  if (!r.ok) throw new Error(js.error || `HTTP ${r.status}`);
  return js;
}

async function status() {
  try {
    const js = await api("/api/status");
    $("status").innerHTML = `<span class="tag ok">OK</span> helper s4field ${esc(js.s4field)} answers this page `
      + `(origin ${esc(origin)}). Cached cones: ${esc(js.cached.join(", ") || "none")}.`;
  } catch (e) {
    $("status").innerHTML = `<span class="tag bad">NO HELPER</span> ${esc(e.message)} · origin ${esc(origin)}`;
  }
}

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = new URLSearchParams({ target: $("target").value, mode: $("mode").value, airmass: $("airmass").value });
  if ($("texp").value.trim()) q.set("texp", $("texp").value.trim());
  $("result").hidden = false; $("report").hidden = true;
  $("result").innerHTML = '<span class="muted">computing… (a first lookup downloads the Gaia cone)</span>';
  const t0 = performance.now();
  try {
    const js = await api("/api/field?" + q);
    const p = js.pointing;
    const comps = Object.entries(js.comparisons).map(([b, c]) => `${b}: ${c.join(" ") || "—"}`).join(" · ");
    $("result").innerHTML =
      `<div class="big">TCSPD offset: RA·cos δ ${p.offset_ra_cosdec_arcsec.toFixed(1)}″ · Dec ${p.offset_dec_arcsec.toFixed(1)}″</div>`
      + `<div>Field centre ${esc(p.hms)} · η ${p.eta.toFixed(3)} · comparisons ${esc(comps)}</div>`
      + `<div class="muted">${esc(js.catalogue.note)} · ${js.stars.length} stars on the detector · `
      + `${((performance.now() - t0) / 1000).toFixed(1)} s</div>`
      + js.warnings.map((w) => `<pre class="bad" style="margin-top:8px;padding:6px">${esc(w)}</pre>`).join("");
    $("report").hidden = false;
    $("report").querySelector("pre").textContent = js.report;
    window.lastField = js;
  } catch (e) {
    $("result").innerHTML = `<span class="tag bad">ERROR</span> ${esc(e.message)}`;
  }
});

status();
</script>
</body>
</html>
